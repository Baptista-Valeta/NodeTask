<h2 class="text-center fw-bold">Login</h2>
<form [formGroup]="authService.credential_form" (ngSubmit)="login()">
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" id="exampleInputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" autocomplete="password" class="form-control" formControlName="password" id="exampleInputPassword1">
    </div>
    <button type="submit" class="btn btn-success w-100">Entrar</button>
    <p></p>
    <p class="text-center justify-content-between text-wrap"> 
        <small>Não tem uma conta? <a routerLink="/auth/register">Clique aqui</a> para cadastrar</small>
    </p>
</form>
